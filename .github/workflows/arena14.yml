name: Arena14

on:
  workflow_dispatch:

env:
  # Pin jqe upstream (devinokeefe/jieqi) — bản đo được trong REPORT.md
  JQE_COMMIT: 331a6e612a038c4a04cf980f7b9482910fd50078
  # sha256 của engine/nets/it014.jqn theo engine/README.md
  JQE_NET_SHA256: f90bd44e8ee244405eb08eb4f784e3f156900f0691f651b5124d50032f8ba160

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential cmake

    - name: Install Python dependencies
      run: pip install websocket-client requests

    - name: Verify jqe net checksum
      run: |
        echo "${JQE_NET_SHA256}  jqe-it014.jqn" | sha256sum -c -

    - name: Build jqe engine (pinned commit)
      run: |
        mkdir jqe-engine
        curl -sL "https://github.com/devinokeefe/jieqi/archive/${JQE_COMMIT}.tar.gz" \
          | tar xz -C jqe-engine --strip-components=1
        cmake -S jqe-engine/engine -B jqe-engine/engine/build -DCMAKE_BUILD_TYPE=Release
        cmake --build jqe-engine/engine/build -j"$(nproc)" --target jqe

    - name: Verify engine (bench signature 45315 nodes với it014)
      run: |
        BIN=jqe-engine/engine/build/jqe
        chmod +x "$BIN"
        printf 'setoption name EvalFile value %s/jqe-it014.jqn\nbench\nquit\n' "$PWD" \
          | "$BIN" | tee bench.log
        grep -q "Nodes searched: 45315" bench.log

    - name: Run jqe bot
      env:
        JQE_ENGINE: ${{ github.workspace }}/jqe-engine/engine/build/jqe
        JQE_NET: ${{ github.workspace }}/jqe-it014.jqn
      run: python3 -u arena14.py
      timeout-minutes: 340

    - name: Upload WS capture logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ws-capture-arena14
        path: ws_capture/
        retention-days: 7
