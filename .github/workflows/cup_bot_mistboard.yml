name: Cờ Úp Bot (Mistboard PikaJieQi)

on:
  workflow_dispatch:

concurrency:
  group: cup-up-bot-mistboard-pikajieqi
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential curl unrar p7zip-full

    - name: Install Python dependencies
      run: pip install websocket-client requests

    - name: Build Mistboard-pinned PikaJieQi engine
      run: bash build_engine_mistboard.sh

    - name: Verify engine
      run: |
        echo "uci" | ./pikajieqi-mistboard | head -3
