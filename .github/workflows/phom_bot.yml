name: Phỏm Bot Auto-Play

on:
  # Trigger manually from the Actions tab
  workflow_dispatch:
    inputs:
      games:
        description: 'Number of games to play (default 10)'
        required: false
        default: '10'
      bet:
        description: 'Bet amount in xu (default 10)'
        required: false
        default: '10'
      delay:
        description: 'Action delay in seconds (default 0.6)'
        required: false
        default: '0.6'

  # Allow scheduling via cron (commented out by default — uncomment to enable)
  # schedule:
  #   - cron: '0 8 * * *'  # Daily at 08:00 UTC

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GAMEVH_USER: ${{ secrets.GAMEVH_USER }}
      GAMEVH_PASSWORD: ${{ secrets.GAMEVH_PASSWORD }}
      PHOM_PLAY: '1'
      PHOM_BET_XU: ${{ github.event.inputs.bet || '10' }}
      PHOM_MAX_GAMES: ${{ github.event.inputs.games || '10' }}
      PHOM_ACTION_DELAY: ${{ github.event.inputs.delay || '0.6' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websocket-client

      - name: Verify secrets are present
        run: |
          if [ -z "$GAMEVH_USER" ] || [ -z "$GAMEVH_PASSWORD" ]; then
            echo "::error::GAMEVH_USER and GAMEVH_PASSWORD secrets must be set in repo settings"
            exit 1
          fi
          echo "Secrets OK — running as user: ${GAMEVH_USER:0:2}***"

      - name: Run Phỏm bot
        run: |
          echo "=== Starting Phỏm bot ==="
          echo "Games: $PHOM_MAX_GAMES | Bet: $PHOM_BET_XU xu | Delay: ${PHOM_ACTION_DELAY}s"
          python phom_bot.py 2>&1 | tee bot_output.log

      - name: Show game summary
        if: always()
        run: |
          echo "=== Game Summary ==="
          grep -E "^\[GAME\] (START|OVER)" bot_output.log || echo "No games completed"
          echo ""
          echo "=== AI Decision Sample ==="
          grep -E "^\[AI\]" bot_output.log | head -20 || echo "No AI decisions logged"
          echo ""
          echo "=== Win/Loss Tally ==="
          total=$(grep -c "^\[GAME\] OVER" bot_output.log || echo 0)
          wins=$(grep "^\[GAME\] OVER" bot_output.log | grep "grade': 1" | grep "slot': 0" | wc -l || echo 0)
          echo "Total games: $total"
          echo "Bot wins:    $wins"
          if [ "$total" -gt 0 ]; then
            echo "Win rate:    $(echo "scale=1; $wins * 100 / $total" | bc)%"
          fi

      - name: Upload bot log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phom-bot-log-${{ github.run_id }}
          path: |
            bot_output.log
            ws_capture/phom/
          retention-days: 30
