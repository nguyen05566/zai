name: Phỏm Bot Auto-Play

on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Number of games to play (default 10)'
        required: false
        default: '10'
      bet:
        description: 'Bet amount in xu (default 10)'
        required: false
        default: '10'
      delay:
        description: 'Action delay in seconds (default 0.6)'
        required: false
        default: '0.6'
      pimc:
        description: 'Enable PIMC for discard decisions (1=on, 0=off)'
        required: false
        default: '1'
      ismcts:
        description: 'Enable IS-MCTS for eat decisions (1=on, 0=off)'
        required: false
        default: '1'
      pimc_rollouts:
        description: 'PIMC rollouts per candidate (default 100)'
        required: false
        default: '100'
      ismcts_rollouts:
        description: 'IS-MCTS rollouts per branch (default 50)'
        required: false
        default: '50'

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GAMEVH_USER: ${{ secrets.GAMEVH_USER }}
      GAMEVH_PASSWORD: ${{ secrets.GAMEVH_PASSWORD }}
      PHOM_PLAY: '1'
      PHOM_BET_XU: ${{ github.event.inputs.bet || '10' }}
      PHOM_MAX_GAMES: ${{ github.event.inputs.games || '10' }}
      PHOM_ACTION_DELAY: ${{ github.event.inputs.delay || '0.6' }}
      PHOM_PIMC: ${{ github.event.inputs.pimc || '1' }}
      PHOM_ISMCTS: ${{ github.event.inputs.ismcts || '1' }}
      PHOM_PIMC_ROLLOUTS: ${{ github.event.inputs.pimc_rollouts || '100' }}
      PHOM_ISMCTS_ROLLOUTS: ${{ github.event.inputs.ismcts_rollouts || '50' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websocket-client

      - name: Verify secrets are present
        run: |
          if [ -z "$GAMEVH_USER" ] || [ -z "$GAMEVH_PASSWORD" ]; then
            echo "::error::GAMEVH_USER and GAMEVH_PASSWORD secrets must be set in repo settings"
            exit 1
          fi
          echo "Secrets OK — running as user: ${GAMEVH_USER:0:2}***"

      - name: Show config
        run: |
          echo "=== Phỏm Bot Config ==="
          echo "Games: $PHOM_MAX_GAMES | Bet: $PHOM_BET_XU xu | Delay: ${PHOM_ACTION_DELAY}s"
          echo "PIMC: $PHOM_PIMC (rollouts=$PHOM_PIMC_ROLLOUTS)"
          echo "IS-MCTS: $PHOM_ISMCTS (rollouts=$PHOM_ISMCTS_ROLLOUTS)"
          echo ""
          echo "Current weights.json:"
          if [ -f weights.json ]; then
            cat weights.json | head -25
          else
            echo "  (no weights.json — bot will use built-in defaults)"
          fi

      - name: Run Phỏm bot
        run: |
          python phom_bot.py 2>&1 | tee bot_output.log

      - name: Show game summary
        if: always()
        run: |
          echo "=== Game Summary ==="
          grep -E "^\[GAME\] (START|OVER)" bot_output.log || echo "No games completed"
          echo ""
          echo "=== PIMC Decision Sample ==="
          grep -E "^\[PIMC\]" bot_output.log | head -10 || echo "No PIMC decisions logged"
          echo ""
          echo "=== IS-MCTS Decision Sample ==="
          grep -E "^\[IS-MCTS\]" bot_output.log | head -10 || echo "No IS-MCTS decisions logged"
          echo ""
          echo "=== AI Heuristic Decision Sample ==="
          grep -E "^\[AI\]" bot_output.log | head -10 || echo "No AI decisions logged"
          echo ""
          echo "=== Stats ==="
          echo "PIMC calls:    $(grep -c '^\[PIMC\]' bot_output.log || echo 0)"
          echo "IS-MCTS calls: $(grep -c '^\[IS-MCTS\]' bot_output.log || echo 0)"
          echo "AI fallback:   $(grep -c '^\[AI\]' bot_output.log || echo 0)"
          echo ""
          echo "=== Win/Loss Tally ==="
          total=$(grep -c "^\[GAME\] OVER" bot_output.log || echo 0)
          wins=$(grep "^\[GAME\] OVER" bot_output.log | grep "slot': 0, 'grade': 1" | wc -l || echo 0)
          echo "Total games: $total"
          echo "Bot wins (slot 0, grade 1): $wins"
          if [ "$total" -gt 0 ]; then
            echo "Win rate: $(echo "scale=1; $wins * 100 / $total" | bc)%"
          fi

      - name: Upload bot log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phom-bot-log-${{ github.run_id }}
          path: |
            bot_output.log
            ws_capture/phom/
          retention-days: 30
