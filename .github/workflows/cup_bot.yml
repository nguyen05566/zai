name: Cờ Úp Bot (PikaJieQi)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# ★ Queue: phiên cron mới sẽ CHỜ phiên trước KẾT THÚC rồi mới chạy
# (không hủy giữa chừng ván — tránh 2 process cùng tài khoản)
concurrency:
  group: cup-bot-jieqi
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependency
      run: pip install websocket-client

    # Engine và NNUE đã nằm trong repo; không clone, build hoặc tải thêm.
    - name: Prepare bundled engine and NNUE
      run: |
        chmod +x pikajieqi-native verify_engine.sh
        test -x pikajieqi-native
        test -s zai_jieqi_master.nnue

    - name: Verify bundled engine and NNUE with Cờ Úp protocol
      run: bash verify_engine.sh
    
    - name: Run cup bot
      env:
        CARO_USER19: ${{ secrets.CARO_USER19 }}
        CARO_PASSWD19: ${{ secrets.CARO_PASSWD19 }}
      run: |
        python3 -u cup_bot_jieqi.py
      timeout-minutes: 340
