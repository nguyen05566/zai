name: n17

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# ★ Queue: phiên cron mới sẽ CHỜ phiên trước KẾT THÚC rồi mới chạy
# (không hủy giữa chừng ván — tránh 2 process cùng tài khoản)
concurrency:
  group: n17-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential
    
    - name: Install Python dependencies
      run: |
        pip install websocket-client requests
    
    - name: Build official Pikafish jieqi_old engine
      run: |
        bash build_engine.sh
    
    - name: Verify engine
      run: |
        uci_output=$(printf 'uci\nquit\n' | ./pikajieqi-native)
        echo "$uci_output"
        grep -q 'option name Threads type spin' <<< "$uci_output"
        grep -q 'option name Hash type spin' <<< "$uci_output"
        grep -q 'option name Ponder type check' <<< "$uci_output"
        grep -q 'option name EvalFile type string' <<< "$uci_output"
        ls -la pikajieqi-native pikafish.nnue
        {
          echo "uci"
          echo "setoption name Threads value 4"
          echo "setoption name Hash value 1024"
          echo "setoption name Ponder value true"
          echo "setoption name EvalFile value $PWD/pikafish.nnue"
          echo "setoption name MultiPV value 1"
          echo "isready"
          sleep 2
          echo "quit"
        } | ./pikajieqi-native 2>&1 | tee /tmp/pikafish-nnue.log
        grep -q "readyok" /tmp/pikafish-nnue.log
    
    - name: Run cup bot
      env:
        CARO_USER17: ${{ secrets.CARO_USER17 }}
        CARO_PASSWD17: ${{ secrets.CARO_PASSWD17 }}
      run: |
        python3 -u n17.py
      timeout-minutes: 340
