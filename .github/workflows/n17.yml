name: n17

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential unrar
    
    - name: Install Python dependencies
      run: |
        pip install websocket-client requests
    
    - name: Build PikaJieQi engine
      run: |
        bash build_engine.sh
    
    - name: Verify engine
      run: |
        echo "uci" | ./pikajieqi-native | head -3
        ls -la pikajieqi-native pikafish.nnue
    
    - name: Run cup bot
      env:
        CARO_USER19: ${{ secrets.CARO_USER19 }}
        CARO_PASSWD19: ${{ secrets.CARO_PASSWD19 }}
      run: |
        python3 -u n17.py
      timeout-minutes: 340
