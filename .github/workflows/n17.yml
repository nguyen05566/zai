name: n17

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# ★ Queue: phiên cron mới sẽ CHỜ phiên trước KẾT THÚC rồi mới chạy
# (không hủy giữa chừng ván — tránh 2 process cùng tài khoản)
concurrency:
  group: n17-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependency
      run: pip install websocket-client

    # ★ Engine chính: OpenJieqi (clone + make ~3s, không cần NNUE).
    # Fallback: official Pikafish jieqi_old + trained NNUE (build_engine.sh tự xử lý).
    - name: Build engine
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential
        bash build_engine.sh

    - name: Verify engine
      run: |
        echo "Engine: $(cat engine_brand.txt)"
        echo "uci" | ./pikajieqi-native | head -3
        if grep -q OpenJieqi engine_brand.txt; then
          { echo uci; echo isready; echo "position startpos"; echo "go infinite"; sleep 2; echo stop; sleep 1; echo quit; } | timeout 20 ./pikajieqi-native | tee /tmp/v.log
          grep -q uciok /tmp/v.log
          grep -q readyok /tmp/v.log
          grep -Eq '^bestmove [a-i][0-9][a-i][0-9]' /tmp/v.log
        else
          bash verify_engine.sh
        fi
    
    - name: Run cup bot
      env:
        CARO_USER17: ${{ secrets.CARO_USER17 }}
        CARO_PASSWD17: ${{ secrets.CARO_PASSWD17 }}
      run: |
        python3 -u n17.py
      timeout-minutes: 340
