name: Arena19

on:
  workflow_dispatch:



concurrency:
  group: arena19-runner
  cancel-in-progress: false


jobs:
  run-bot:
    runs-on: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04]
    timeout-minutes: 350
    steps:
    - name: Wait for available runner (avoid queue pile-up)
      run: |
        echo "Waiting up to 15 minutes for a runner to be available..."
        for i in $(seq 1 90); do
          # Check if we're actually running (not queued)
          if [ "$RUNNER_NAME" != "" ]; then
            echo "Runner assigned: $RUNNER_NAME"
            break
          fi
          echo "  Attempt $i/90: still waiting..."
          sleep 10
        done
        echo "Proceeding with job"
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential

    - name: Install Python dependencies
      run: pip install websocket-client requests

    - name: Build pinned JieqiCore engine
      run: bash build_engine_jieqi_core.sh

    - name: Verify engine
      run: bash verify_jieqi_core.sh ./jieqi-core

    - name: Run JieqiCore bot
      env:
        MISTBOARD_JIEQI_ENGINE: ./jieqi-core
      run: python3 -u arena19.py
      timeout-minutes: 340

    - name: Upload WS capture logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ws-capture-arena19
        path: ws_capture/
        retention-days: 7
