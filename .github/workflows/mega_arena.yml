name: Mega Arena (8 bots in 1 job)

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Max runtime in hours (default 5.5)'
        required: false
        default: '5.5'

jobs:
  mega-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 340  # 5h40m hard cap (slightly more than runtime)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential

      - name: Install Python dependencies
        run: pip install websocket-client requests

      - name: Build pinned JieqiCore engine
        run: bash build_engine_jieqi_core.sh

      - name: Verify engine
        run: bash verify_jieqi_core.sh ./jieqi-core

      - name: Show config
        run: |
          RUNTIME_HOURS="${{ github.event.inputs.runtime_hours || '5.5' }}"
          RUNTIME_SEC=$(echo "$RUNTIME_HOURS * 3600" | bc | cut -d. -f1)
          echo "Runtime: $RUNTIME_HOURS hours ($RUNTIME_SEC sec)"
          echo "Bots: arena5, arena6, arena8, arena14, arena15, arena18, arena19, arena13"
          echo "MEGA_RUNTIME_SEC=$RUNTIME_SEC" >> $GITHUB_ENV
          echo "Workers: $(nproc) CPUs"
          echo ""
          echo "Engine:"
          ./jieqi-core <<< "uci" 2>&1 | head -3

      - name: Run Mega Arena (8 bots in parallel)
        env:
          MEGA_RUNTIME_SEC: ${{ env.MEGA_RUNTIME_SEC }}
          MISTBOARD_JIEQI_ENGINE: ./jieqi-core
        run: |
          python3 -u mega_arena.py 2>&1 | tee mega_orchestrator.log

      - name: Show per-bot summary
        if: always()
        run: |
          echo "=== Per-bot Summary ==="
          for log in mega_logs/*.log; do
            if [ -f "$log" ]; then
              name=$(basename "$log" .log)
              games=$(grep -c "\[GAME\] OVER" "$log" 2>/dev/null || echo 0)
              wins=$(grep "\[GAME\] OVER" "$log" 2>/dev/null | grep "grade': 1" | grep "slot': 0" | wc -l || echo 0)
              size=$(stat -c %s "$log" 2>/dev/null || echo 0)
              echo "  $name: games=$games wins=$wins log_size=$size"
            fi
          done
          echo ""
          echo "=== Last 20 lines of orchestrator log ==="
          tail -20 mega_orchestrator.log || echo "No orchestrator log"

      - name: Upload all logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-arena-logs-${{ github.run_id }}
          path: |
            mega_orchestrator.log
            mega_logs/
            ws_capture/
          retention-days: 7
